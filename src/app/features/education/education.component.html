<section id="education" class="section-wrapper education-section">
  <div class="container">
    <!-- Header -->
    <div class="section-header">
      <span class="section-badge">Academics</span>
      <h2 class="section-title">MY <span class="gradient-text">EDUCATION</span></h2>
      <p class="section-subtitle">
        Rigorous academic foundation in Computer Science & Engineering, fostering algorithmic thinking and engineering best practices.
      </p>
    </div>

    <!-- Vertical Timeline -->
    <div class="timeline-container">
      <div *ngFor="let item of educationList" class="timeline-card-wrapper">
        <!-- Center node pin -->
        <div class="timeline-pin">
          <div class="pin-inner"></div>
        </div>

        <!-- Glass Timeline Card -->
        <div class="glass-card education-card">
          <div class="edu-top">
            <span class="edu-status-badge">
              <span class="status-live-dot"></span>
              {{ item.status }}
            </span>
            <span class="edu-period">{{ item.period }}</span>
          </div>

          <h3 class="edu-degree">{{ item.degree }}</h3>
          <div class="edu-institution">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="inst-icon">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
            <span class="inst-name">{{ item.institution }}</span>
          </div>

          <div class="edu-location">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
            <span>{{ item.location }}</span>
          </div>

          <!-- Academic Highlights -->
          <div class="edu-highlights">
            <div class="highlight-title">Curriculum & Core Focus:</div>
            <ul class="highlights-list">
              <li *ngFor="let hl of item.highlights">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bullet-icon">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
                <span>{{ hl }}</span>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
