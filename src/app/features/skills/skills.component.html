<section id="skills" class="section-wrapper skills-section">
  <div class="container">
    <!-- Header -->
    <div class="section-header">
      <span class="section-badge">Capabilities</span>
      <h2 class="section-title">TECHNICAL <span class="gradient-text">EXPERTISE</span></h2>
      <p class="section-subtitle">
        Curated technology stack spanning languages, modern client frameworks, scalable backends, databases, and version workflows.
      </p>
    </div>

    <!-- Category Grid -->
    <div class="categories-grid">
      <div 
        *ngFor="let category of skillCategories; let i = index" 
        class="glass-card skill-cat-card">
        
        <div class="card-header">
          <div class="category-icon-wrapper">
            <svg *ngIf="category.title.includes('Programming')" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 18 22 12 16 6"/>
              <polyline points="8 6 2 12 8 18"/>
            </svg>
            <svg *ngIf="category.title.includes('Frontend')" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
              <line x1="3" y1="9" x2="21" y2="9"/>
              <line x1="9" y1="21" x2="9" y2="9"/>
            </svg>
            <svg *ngIf="category.title.includes('Backend')" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="8" x="2" y="2" rx="2" ry="2"/>
              <rect width="20" height="8" x="2" y="14" rx="2" ry="2"/>
              <line x1="6" y1="6" x2="6.01" y2="6"/>
              <line x1="6" y1="18" x2="6.01" y2="18"/>
            </svg>
            <svg *ngIf="category.title.includes('Database')" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <ellipse cx="12" cy="5" rx="9" ry="3"/>
              <path d="M3 5V19A9 3 0 0 0 21 19V5"/>
              <path d="M3 12A9 3 0 0 0 21 12"/>
            </svg>
            <svg *ngIf="category.title.includes('Mobile')" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="14" height="20" x="5" y="2" rx="2" ry="2"/>
              <path d="M12 18h.01"/>
            </svg>
            <svg *ngIf="category.title.includes('Tools')" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="6" y1="3" x2="6" y2="15"/>
              <circle cx="18" cy="6" r="3"/>
              <circle cx="6" cy="18" r="3"/>
              <path d="M18 9a9 9 0 0 1-9 9"/>
            </svg>
          </div>
          <div>
            <h3 class="category-title">{{ category.title }}</h3>
            <span class="category-count">{{ category.skills.length }} Technologies</span>
          </div>
        </div>

        <p class="category-desc">{{ category.description }}</p>

        <!-- Skill Badges -->
        <div class="skills-list">
          <div *ngFor="let skill of category.skills" class="skill-item-pill">
            <span class="skill-indicator-dot"></span>
            <span class="skill-name">{{ skill.name }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
